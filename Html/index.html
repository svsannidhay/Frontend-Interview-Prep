<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla JavaScript - Interview Questions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    
    #root {
      margin-top: 30px;
      min-height: 200px;
    }
    
    .question-list {
      list-style: none;
    }
    
    .question-list li {
      padding: 15px;
      background: #f5f5f5;
      margin: 10px 0;
      border-radius: 4px;
      border-left: 4px solid #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Vanilla JavaScript Interview Questions</h1>
    <p class="subtitle">Test your solutions here</p>
    <div id="root">
      <!-- Insert your vanilla JS code here -->
    </div>
  </div>

  <script type="module" src="../Javascript/debounce.js"></script>
</body>
</html>
